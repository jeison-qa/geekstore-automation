serenity {
    take.screenshots = AFTER_EACH_STEP
    restart.browser.for.each = scenario
    delay.between.steps = 500
}

headless.mode = false
webdriver.timeouts.implicitlywait = 5000
webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*","test-type", "no-sandbox", "ignore-certificate-errors", "--window-size=1440,900",
        "incognito","headless" "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking",
        "disable-dev-shm-usage", "disable-extensions", "disable-web-security", "disable-translate", "disable-logging",
        ]
    }
  }
}
